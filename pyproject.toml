[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iroshine"
version = "0.5.0"
description = "Turn LeetCode solutions into beautiful, musical Manim animations."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Julius Sanchez", email = "julius.jin.sanchez@gmail.com"}]
requires-python = ">=3.10"
dependencies = ["manim>=0.18", "numpy"]

[tool.setuptools]
packages = ["iroshine"]
